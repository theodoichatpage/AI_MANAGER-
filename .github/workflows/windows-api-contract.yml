name: Windows API contract
on:
  push:
    branches: [phase4-windows-agent-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-pywin32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real Windows dependencies
        run: python -m pip install -r requirements-windows.txt
      - name: Audit every referenced Windows API
        run: python -m automation_agent.windows_api_contract > windows-api-contract.json
      - name: Real-module contract and old-code regression
        run: python -m unittest discover -s tests -p test_windows_api_contract.py -v
      - name: Agent-owned binding regression (separate unit tests)
        run: python -m unittest discover -s tests -p test_edge_binding_regression.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-api-contract
          path: windows-api-contract.json
